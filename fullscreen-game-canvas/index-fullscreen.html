<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tanky Troubles</title>
    <link rel="stylesheet" href="style-fullscreen.css">

    <!-- Favicon Links -->
    <link rel="icon" type="image/x-icon" href="../assets/logos/TankyTroubles-Logo-2048x.ico">
</head>
<body>
    <header class="header-container">
        <h1>Tanky Troubles</h1>
        <h2><em>Wide Page - <a href="../index.html">Click here to go back</a></em></h2>
    </header>

    <!-- Main Container -->
    <div id="main-container">


        <!-- Center Container -->
        <div id="center-container">

            <!-- Game Container -->
            <div id="game-container"tabindex="0" class="theater-mode">
            
                <!-- Game Canvas Container (fixed 16:9 Aspect Ratio) -->
                <div id="game-canvas-container">
                    <canvas id="game-canvas"></canvas>
                    <div id="game-unfocus-overlay">
                        <p>Click to refocus on the game</p>
                    </div>
                </div>

                <!-- Game Controls -->
                <div id="game-controls">
                    <button id="toggle-theater-mode" class="game-control-btn">
                        <img id="theater-icon" src="../assets/icons/expand_content_40dp_E3E3E3_FILL1_wght400_GRAD0_opsz40.svg" alt="Theater Mode">
                    </button>
                    <button id="toggle-fullscreen" class="game-control-btn">
                        <img id="fullscreen-icon" src="../assets/icons/fullscreen_40dp_E3E3E3_FILL1_wght400_GRAD0_opsz40.svg" alt="Fullscreen">
                    </button>
                    <button id="toggle-audio" class="game-control-btn">
                        <img id="audio-icon" src="../assets/icons/volume_up_40dp_E3E3E3_FILL1_wght400_GRAD0_opsz40.svg" alt="Toggle Audio">
                    </button>
                </div>
            </div>
    
    <!-- Scripts -->
    <script type="module" src="script-fullscreen.js"></script>
    <script type="module" src="../games/tanky-troubles/scripts/game.js"></script>
</body>
</html>
