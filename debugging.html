<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TT Debugging</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Favicon Links -->
    <link rel="icon" type="image/x-icon" href="../assets/logos/TankyTroubles-Logo-2048x.ico" />
  </head>
  <body>
    <div><a id="debugpage-button" class="side-bar-button" href="/">Click here to go back to 'Main'</a></div>
    <pre id="debug-output"></pre>

    <script>
      function refreshDebug() {
        const debugText = localStorage.getItem("debugText");
        if (debugText) {
          document.getElementById("debug-output").innerHTML = debugText;
        }
      }

      // Refresh every x ms
      setInterval(refreshDebug, 125); // 8 hz - updates per sec
    </script>
  </body>
</html>
